providers:
  strata:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    compat:
      qwenTemplateReasoningEffort: true
      extraBody:
        reasoning_effort: medium
        reasoning_budget_tokens: 3072
        temperature: 1.0
        top_p: 0.95
        top_k: 20
    models:
      - id: qwen3.8-flash-next-coder-iq1_m
        name: Qwen3.8-Flash-Next Coder
        reasoning: true
        input: [text, image]
        imageInputDecoder: stb
        contextWindow: 262144
        maxTokens: 16384
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
  mac:
    baseUrl: http://127.0.0.1:1234/v1
    api: openai-completions
    auth: none
    compat:
      extraBody:
        reasoning_effort: none
    models:
      - id: side-model
        name: Side model
        reasoning: false
        input: [text, image]
        imageInputDecoder: stb
        contextWindow: 32768
        maxTokens: 4096
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
